<nav class="breadcrumbs" aria-label="Breadcrumb">
  @for (item of breadcrumbs(); track item.label; let isLast = $last) { @if (!isLast && item.href) {
  <a class="breadcrumbs-link" [routerLink]="item.href">{{ item.label }}</a>
  } @else {
  <span
    class="breadcrumbs-item"
    [class.breadcrumbs-current]="isLast"
    [attr.aria-current]="isLast ? 'page' : null"
    >{{ item.label }}</span
  >
  } @if (!isLast) {
  <span class="breadcrumbs-separator material-symbols-outlined" aria-hidden="true"
    >{{ separatorIcon }}</span
  >
  } }
</nav>
