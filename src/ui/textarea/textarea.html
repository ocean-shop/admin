<div class="m3-textfield group" [class.has-error]="!!errorMessage()">
  <div class="relative">
    <textarea
      class="admin-textarea"
      [class.has-error]="!!errorMessage()"
      [id]="id()"
      [placeholder]="placeholder() || ' '"
      [rows]="rows()"
      [formField]="control()"
      (focus)="focusEvent.emit($event)"
      (blur)="blurEvent.emit($event)"
    ></textarea>
    @if (label()) {
    <label class="font-body-md" [for]="id()">{{ label() }}</label>
    }
  </div>
  @if (errorMessage()) {
  <div class="text-error text-xs mt-1 pl-4">{{ errorMessage() }}</div>
  }
</div>
