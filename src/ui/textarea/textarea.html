<div class="m3-textfield admin-field" [class.has-error]="!!errorMessage()">
  @if (label()) {
  <label class="admin-field-label" [for]="id()">{{ label() }}</label>
  }
  <textarea
    class="admin-textarea"
    [class.has-error]="!!errorMessage()"
    [id]="id()"
    [placeholder]="placeholder()"
    [rows]="rows()"
    [formField]="control()"
    [attr.aria-invalid]="!!errorMessage() || null"
    (focus)="focusEvent.emit($event)"
    (blur)="blurEvent.emit($event)"
  ></textarea>
  @if (errorMessage()) {
  <p class="admin-field-error" role="alert">{{ errorMessage() }}</p>
  }
</div>
