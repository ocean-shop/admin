<article class="store-card">
  <div class="card-bg-primary" aria-hidden="true"></div>

  <div class="card-header">
    <span class="card-avatar" aria-hidden="true">
      <span class="material-symbols-outlined">{{ icons.STORE }}</span>
    </span>
    <h4 class="card-title">{{ card().title }}</h4>
  </div>

  <div class="metrics-grid">
    @for (metric of card().metrics; track metric.label) {
    <div class="metric-box">
      <p class="metric-label">{{ metric.label }}</p>
      <p class="metric-value">{{ metric.value }}</p>
      @if (metric.helperText) {
      <span class="metric-helper">
        @if (metric.helperIcon) {
        <span class="material-symbols-outlined metric-helper-icon" aria-hidden="true"
          >{{ metric.helperIcon }}</span
        >
        } {{ metric.helperText }}
      </span>
      }
    </div>
    }
  </div>

  <div class="card-actions">
    <button class="btn-primary" type="button" (click)="onManageStore()">
      <span>{{ card().actionLabel || textData.DEFAULT_ACTION_LABEL }}</span>
      <span class="material-symbols-outlined btn-primary-icon" aria-hidden="true"
        >{{ icons.ACTION }}</span
      >
    </button>
  </div>
</article>
