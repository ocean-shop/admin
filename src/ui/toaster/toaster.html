<div class="toaster-container" aria-live="polite">
  @for (toast of toasts(); track toast.id) {
  <div class="toast toast-{{ toast.type }}" role="status">
    <div class="toast-icon-wrapper" aria-hidden="true">
      <span
        class="material-symbols-outlined toast-icon"
        [style.font-variation-settings]="getIconFill(toast.type)"
      >
        {{ getIcon(toast.type) }}
      </span>
    </div>
    <div class="toast-text-wrapper">
      <span class="toast-title">{{ toast.title }}</span>
      @if (toast.message) {
      <span class="toast-message">{{ toast.message }}</span>
      } @if (toast.actionText) {
      <div class="toast-actions">
        <button
          class="toast-action-btn"
          type="button"
          (click)="handleAction(toast.id, toast.onAction)"
        >
          {{ toast.actionText }}
        </button>
      </div>
      }
    </div>
    <button
      class="toast-close-btn"
      type="button"
      [attr.aria-label]="textData.CLOSE_LABEL"
      (click)="close(toast.id)"
    >
      <span class="material-symbols-outlined" aria-hidden="true">{{ closeIcon }}</span>
    </button>
  </div>
  }
</div>
