<div
  class="admin-dropdown-container"
  [class.admin-dropdown-container-click]="triggerMode() === 'click'"
  [class.admin-dropdown-container-form]="variant() === 'form'"
  [class.admin-dropdown-container-open]="triggerMode() === 'click' && isOpen()"
>
  <button
    type="button"
    class="admin-dropdown-trigger"
    [class.admin-dropdown-trigger-form]="variant() === 'form'"
    [class.admin-dropdown-trigger-bordered]="variant() === 'bordered'"
    aria-haspopup="listbox"
    [attr.aria-expanded]="triggerMode() === 'click' ? isOpen() : null"
    (click)="toggleMenu($event)"
  >
    @if (icon()) {
    <span class="material-symbols-outlined admin-dropdown-trigger-icon" aria-hidden="true"
      >{{ icon() }}</span
    >
    }
    <span class="admin-dropdown-trigger-label">{{ displayLabel() }}</span>
    <span
      class="admin-dropdown-icon-small material-symbols-outlined"
      aria-hidden="true"
      [class.admin-dropdown-icon-rotated]="triggerMode() === 'click' && isOpen()"
    >
      {{ expandIcon }}
    </span>
  </button>
  <div class="admin-dropdown-menu">
    <ul class="admin-dropdown-list" role="listbox">
      @for (option of options(); track option.value) {
      <li role="option" [attr.aria-selected]="option.value === value()">
        <a
          class="admin-dropdown-item"
          [class.admin-dropdown-item-selected]="option.value === value()"
          href="#"
          (click)="selectOption(option, $event)"
        >
          <span class="admin-dropdown-item-label">{{ option.label }}</span>
          @if (option.value === value()) {
          <span class="material-symbols-outlined admin-dropdown-item-check" aria-hidden="true"
            >{{ checkIcon }}</span
          >
          }
        </a>
      </li>
      }
    </ul>
  </div>
</div>
