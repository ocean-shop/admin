<article class="stat-card">
  <div class="stat-card-top">
    <span class="stat-card-label">{{ label() }}</span>
    @if (icon()) {
    <span class="stat-card-icon" aria-hidden="true">
      <span class="material-symbols-outlined">{{ icon() }}</span>
    </span>
    }
  </div>
  <p class="stat-card-value">{{ value() }}</p>
  @if (change() || previous()) {
  <p class="stat-card-change">
    @if (change(); as change) {
    <app-change-badge [label]="change.label" [direction]="change.direction" [tone]="change.tone" />
    } @if (previous()) {
    <span class="stat-card-previous">{{ previous() }}</span>
    }
  </p>
  } @if (helper()) {
  <p class="stat-card-helper">{{ helper() }}</p>
  }
</article>
