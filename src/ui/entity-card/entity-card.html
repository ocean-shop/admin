<article class="entity-card">
  <div class="entity-meta">
    <div class="entity-icon" aria-hidden="true">
      <span class="material-symbols-outlined">{{ icon() }}</span>
    </div>
    <div class="entity-identity">
      <p class="entity-title">
        @if (entity().titleLink; as titleLink) {
        <a class="entity-title-link" [routerLink]="titleLink">{{ entity().title }}</a>
        } @else { {{ entity().title }} }
      </p>
      <p class="entity-subtitle">{{ entity().subtitle }}</p>
    </div>
  </div>

  <div class="entity-actions-row">
    @if (entity().detail) {
    <div class="entity-detail">
      <span class="material-symbols-outlined entity-detail-icon" aria-hidden="true"
        >{{ icons.DETAIL }}</span
      >
      <span class="entity-detail-text">{{ entity().detail }}</span>
    </div>
    } @if (entity().badge) {
    <app-badge class="entity-badge" tone="primary" [plain]="true" [label]="entity().badge" />
    }

    <div class="action-buttons">
      <button
        class="icon-btn-edit"
        type="button"
        [attr.aria-label]="textData.EDIT_LABEL"
        [attr.title]="textData.EDIT_LABEL"
        (click)="onEdit()"
      >
        <span class="material-symbols-outlined" aria-hidden="true">{{ icons.EDIT }}</span>
      </button>
      <button
        class="icon-btn-delete"
        type="button"
        [attr.aria-label]="textData.DELETE_LABEL"
        [attr.title]="textData.DELETE_LABEL"
        (click)="onDelete()"
      >
        <span class="material-symbols-outlined" aria-hidden="true">{{ icons.DELETE }}</span>
      </button>
    </div>
  </div>
</article>
