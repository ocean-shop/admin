<div
  class="m3-textfield admin-field"
  [class.has-icon]="!!icon()"
  [class.has-error]="!!errorMessage()"
  [class.is-disabled]="disabled()"
>
  @if (label()) {
  <label class="admin-field-label" [for]="id()">{{ label() }}</label>
  }
  <div class="admin-field-control">
    @if (icon()) {
    <span class="material-symbols-outlined input-icon" aria-hidden="true">{{ icon() }}</span>
    } @if (control()) {
    <input
      class="admin-input"
      [class.has-icon]="!!icon()"
      [class.has-error]="!!errorMessage()"
      [id]="id()"
      [placeholder]="placeholder()"
      [type]="type()"
      [formField]="control()"
      [attr.aria-invalid]="!!errorMessage() || null"
      (focus)="focusEvent.emit($event)"
      (blur)="blurEvent.emit($event)"
      (input)="onInput($event)"
    />
    } @else {
    <input
      class="admin-input"
      [class.has-icon]="!!icon()"
      [id]="id()"
      [placeholder]="placeholder()"
      [type]="type()"
      [value]="value()"
      [disabled]="disabled()"
      (focus)="focusEvent.emit($event)"
      (blur)="blurEvent.emit($event)"
      (input)="onInput($event)"
    />
    }
  </div>
  @if (errorMessage()) {
  <p class="admin-field-error" role="alert">{{ errorMessage() }}</p>
  }
</div>
