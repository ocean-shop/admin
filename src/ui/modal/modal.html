@if (isOpen()) {
<div
  class="modal-overlay"
  role="dialog"
  tabindex="0"
  aria-modal="true"
  [attr.aria-label]="title()"
  (click)="onBackdropClick($event)"
  (keydown)="onBackdropKeydown($event)"
>
  <div class="modal-content" [class.modal-content-sm]="size() === 'sm'">
    <div class="modal-header">
      <div class="modal-heading">
        @if (isDanger()) {
        <span class="modal-danger-icon">
          <span class="material-symbols-outlined" aria-hidden="true">{{ dangerIcon }}</span>
        </span>
        }
        <h3 class="modal-title">{{ title() }}</h3>
      </div>
      <button
        class="modal-close-button"
        type="button"
        [attr.aria-label]="textData.CLOSE_LABEL"
        (click)="closed.emit()"
      >
        <span class="material-symbols-outlined" aria-hidden="true">{{ closeIcon }}</span>
      </button>
    </div>

    <div class="modal-body">
      <ng-content />
    </div>

    @if (showFooter()) {
    <div class="modal-footer">
      @if (showCancel()) {
      <button class="modal-cancel-button" type="button" (click)="closed.emit()">
        {{ cancelLabel() }}
      </button>
      }
      <button
        class="modal-confirm-button"
        [class.modal-confirm-button-danger]="isDanger()"
        [disabled]="confirmDisabled() || confirmLoading()"
        [attr.aria-busy]="confirmLoading() || null"
        type="button"
        (click)="confirmed.emit()"
      >
        @if (confirmLoading()) {
        <span class="modal-confirm-spin" aria-hidden="true"></span>
        {{ textData.LOADING_LABEL }} } @else { {{ confirmLabel() }} }
      </button>
    </div>
    }
  </div>
</div>
}
