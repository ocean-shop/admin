<label
  class="admin-switch"
  [class.admin-switch-disabled]="disabled()"
  [class.admin-switch-label-start]="labelPosition() === 'start'"
  [attr.for]="inputId()"
>
  @if (control()) {
  <input
    class="admin-switch-input"
    role="switch"
    type="checkbox"
    [id]="inputId()"
    [formField]="control()"
    [attr.aria-label]="ariaLabel() || null"
    (change)="onChange($event)"
  />
  } @else {
  <input
    class="admin-switch-input"
    role="switch"
    type="checkbox"
    [id]="inputId()"
    [checked]="checked()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel() || null"
    (change)="onChange($event)"
  />
  }
  <span class="admin-switch-text">
    <span class="admin-switch-label">{{ label() }}</span>
    @if (description()) {
    <span class="admin-switch-description">{{ description() }}</span>
    }
  </span>
</label>
