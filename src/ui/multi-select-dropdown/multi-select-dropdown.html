<div
  class="multi-select-container"
  [class.multi-select-container-click]="triggerMode() === 'click'"
  [class.multi-select-container-form]="variant() === 'form'"
  [class.multi-select-container-open]="triggerMode() === 'click' && isOpen()"
>
  <button
    type="button"
    class="multi-select-trigger"
    [class.multi-select-trigger-form]="variant() === 'form'"
    [class.multi-select-trigger-bordered]="variant() === 'bordered'"
    aria-haspopup="listbox"
    [attr.aria-expanded]="triggerMode() === 'click' ? isOpen() : null"
    (click)="toggleMenu($event)"
  >
    @if (icon()) {
    <span class="material-symbols-outlined multi-select-trigger-icon" aria-hidden="true"
      >{{ icon() }}</span
    >
    }
    <span class="multi-select-trigger-label">{{ displayLabel() }}</span>
    <span
      class="multi-select-icon-small material-symbols-outlined"
      aria-hidden="true"
      [class.multi-select-icon-rotated]="triggerMode() === 'click' && isOpen()"
    >
      {{ expandIcon }}
    </span>
  </button>
  <div class="multi-select-menu">
    <ul class="multi-select-list" role="listbox" aria-multiselectable="true">
      @for (option of displayOptions(); track option.value) {
      <li role="option" [attr.aria-selected]="isSelected(option.value)">
        <button
          type="button"
          class="multi-select-item"
          [class.multi-select-item-selected]="isSelected(option.value)"
          [style.padding-left.px]="resolveOptionPadding(option)"
          (click)="toggleOption(option, $event)"
        >
          <span class="multi-select-item-box" aria-hidden="true">
            @if (isSelected(option.value)) {
            <span class="material-symbols-outlined multi-select-item-icon">check</span>
            }
          </span>
          <span class="multi-select-item-label">{{ option.label }}</span>
        </button>
      </li>
      }
    </ul>
  </div>
</div>
