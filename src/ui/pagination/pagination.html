<div class="pagination-container">
  <p class="pagination-summary">
    {{ textData.SHOWING }} {{ startItem() }}–{{ endItem() }} {{ textData.OF }} {{ totalItems() }} {{
    label() }}
  </p>

  <nav class="pagination-controls" [attr.aria-label]="textData.NAV_LABEL">
    <button
      class="pagination-arrow-button"
      type="button"
      [disabled]="isPrevDisabled()"
      [attr.aria-label]="textData.PREVIOUS_LABEL"
      (click)="previousPage()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">{{ prevIcon }}</span>
    </button>

    @for (page of visiblePages(); track page) {
    <button
      class="pagination-page-button"
      [class.pagination-page-button-active]="page === currentPage()"
      type="button"
      [attr.aria-current]="page === currentPage() ? 'page' : null"
      [attr.aria-label]="textData.PAGE_LABEL + ' ' + page"
      (click)="changePage(page)"
    >
      {{ page }}
    </button>
    }

    <button
      class="pagination-arrow-button"
      type="button"
      [disabled]="isNextDisabled()"
      [attr.aria-label]="textData.NEXT_LABEL"
      (click)="nextPage()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">{{ nextIcon }}</span>
    </button>
  </nav>
</div>
