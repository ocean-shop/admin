<section class="admins-page">
  <header class="admins-header">
    <h3 class="admins-title">{{ title }}</h3>
    <app-button
      [label]="createAdminLabel"
      [icon]="createAdminIcon"
      [iconLeading]="true"
      [fullWidth]="false"
      variant="create"
      type="button"
      (click)="onCreateAdmin()"
    />
  </header>

  @if (!isLoading() && !hasAdmins()) {
  <p class="state-text">{{ emptyState }}</p>
  } @else {
  <div class="admins-list">
    @for (adminCard of adminCards(); track adminCard.id) {
    <app-entity-card
      [entity]="adminCard"
      [icon]="'person'"
      (edit)="onEditAdmin(adminCard)"
      (removed)="onDeleteAdmin(adminCard)"
    />
    }
  </div>

  @if (totalItems() > ADMINS_PAGE_SIZE) {
  <app-pagination
    class="admins-pagination"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalItems]="totalItems()"
    [totalPages]="totalPages()"
    [label]="paginationLabel"
    (pageChange)="onPageChange($event)"
  />
  } }

  <app-admin-form-modal
    [isOpen]="isFormModalOpen()"
    [mode]="formModalMode()"
    [admin]="selectedAdmin()"
    [roleOptions]="roleOptions"
    [shopOptions]="shopOptions()"
    [confirmLoading]="isActionLoading()"
    (closed)="onCloseModal()"
    (confirmed)="onConfirmFormModal($event)"
  />

  <app-modal
    [isOpen]="isDeleteModalOpen()"
    [title]="deleteModalTitle"
    [confirmLabel]="deleteModalConfirmLabel"
    [confirmLoading]="isActionLoading()"
    [confirmDisabled]="isActionLoading()"
    [isDanger]="true"
    (closed)="onCloseModal()"
    (confirmed)="onConfirmDelete()"
  >
    <p class="admins-delete-message">{{ deleteModalMessage }}</p>
  </app-modal>
</section>
