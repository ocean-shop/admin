<app-page-layout>
  <app-page-header [title]="textData.PAGE_TITLE">
    <app-button
      [label]="textData.CREATE_LABEL"
      [icon]="createShopIcon"
      [iconLeading]="true"
      [fullWidth]="false"
      variant="create"
      type="button"
      (click)="onCreateShop()"
    />
  </app-page-header>

  @if (shopsQuery.isError()) {
  <app-state-message tone="warning" [message]="textData.LOAD_ERROR_MESSAGE" />
  } @else if (isEmpty()) {
  <app-state-message [message]="textData.EMPTY_STATE" />
  } @else {
  <div class="shops-list">
    @for (shopCard of shopCards(); track shopCard.id) {
    <app-entity-card
      [entity]="shopCard"
      [icon]="cardIcon"
      (edit)="onEditShop(shopCard)"
      (removed)="onDeleteShop(shopCard)"
    />
    }
  </div>
  } @if (hasPagination()) {
  <app-pagination
    [currentPage]="currentPage()"
    [pageSize]="pageSize"
    [totalItems]="totalItems()"
    [totalPages]="totalPages()"
    [label]="textData.PAGINATION_LABEL"
    (pageChange)="onPageChange($event)"
  />
  }

  <app-shops-form-modal
    [isOpen]="isFormModalOpen()"
    [mode]="formModalMode()"
    [shop]="selectedShop()"
    [confirmLoading]="isActionLoading()"
    (closed)="onCloseModal()"
    (confirmed)="onConfirmFormModal($event)"
  />

  <app-confirm-modal
    [isOpen]="isDeleteModalOpen()"
    [title]="textData.MODAL_DELETE_TITLE"
    [confirmLabel]="textData.MODAL_DELETE_CONFIRM_LABEL"
    [message]="textData.MODAL_DELETE_MESSAGE"
    [highlight]="selectedShopName()"
    [suffix]="textData.MODAL_DELETE_SUFFIX"
    [loading]="isActionLoading()"
    (closed)="onCloseModal()"
    (confirmed)="onConfirmDelete()"
  />
</app-page-layout>
