<app-page-layout>
  <app-page-header [title]="textData.PAGE_TITLE" [description]="textData.PAGE_SUBTITLE" />

  @if (adminQuery.isError()) {
  <app-state-message tone="warning" [message]="textData.LOAD_ERROR_MESSAGE" />
  } @else if (isEmpty()) {
  <app-empty-state [title]="textData.EMPTY_STATE" [icon]="emptyIcon" />
  } @else {
  <div class="cards-grid">
    @for (card of cards(); track card.shopId) {
    <app-shop-overview-card [card]="card" (manageStore)="onManageStore($event)" />
    }
  </div>
  }
</app-page-layout>
