<div class="home-container">
  <header class="home-header">
    <h3 class="home-title">Огляд магазинів</h3>
    <p class="home-subtitle">Магазини, призначені вашому обліковому запису адміністратора.</p>
  </header>

  @if (!hasCards()) {
  <div class="home-state">До вашого облікового запису не призначено жодного магазину.</div>
  } @else {
  <div class="cards-grid">
    @for (card of cards(); track card.shopId) {
    <app-shop-overview-card [card]="card" (manageStore)="onManageStore($event)" />
    }
  </div>
  }
</div>
