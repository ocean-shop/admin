<app-product-form-card
  [title]="texts().VARIATIONS_TITLE"
  [icon]="icon"
  [disabled]="sidebarDisabled()"
>
  <button
    cardActions
    type="button"
    class="product-form-variations-add"
    [disabled]="sidebarDisabled()"
    (click)="onAdd()"
  >
    {{ texts().VARIATION_ADD_BUTTON_LABEL }}
  </button>

  @for (variation of variations(); track variation.localId; let index = $index) {
  <app-product-form-variation-card
    [variation]="variation"
    [index]="index"
    [texts]="texts()"
    [disabled]="sidebarDisabled()"
    (fieldChange)="onFieldChange(variation.localId, $event)"
    (attributeSearchChange)="onAttributeSearchChange(variation.localId, $event)"
    (attributeAssign)="onAttributeAssign(variation.localId, $event)"
    (attributeUnassign)="onAttributeUnassign(variation.localId, $event)"
    (imageFilesSelected)="onImageFilesSelected(variation.localId, $event)"
    (imageMoveUp)="onImageMoveUp(variation.localId, $event)"
    (imageMoveDown)="onImageMoveDown(variation.localId, $event)"
    (imageRemove)="onImageRemove(variation.localId, $event)"
    (removed)="onRemove(variation.localId)"
    (saved)="onSave(variation.localId)"
  />
  } @empty {
  <p class="product-form-variations-empty">{{ texts().VARIATIONS_EMPTY }}</p>
  }
</app-product-form-card>
