<article class="product-form-card" [class.product-form-card-disabled]="sidebarDisabled()">
  <h2 class="product-form-card-title product-form-card-title-icon">
    <span class="material-symbols-outlined">category</span>
    {{ texts().CATEGORIES_TITLE }}
  </h2>
  <div class="product-form-static-scroll">
    @for (category of categoryNodes(); track category.id) {
    <app-checkbox
      class="product-form-tree-row"
      [id]="'category-' + category.id"
      [label]="category.label"
      [checked]="category.checked"
      [disabled]="sidebarDisabled() || !!category.disabled"
      (checkedChange)="onCategoryCheckedChange(category.id, $event)"
    />

    @if (category.children?.length) {
    <div class="product-form-tree-children">
      @for (childCategory of category.children; track childCategory.id) {
      <app-checkbox
        class="product-form-tree-row"
        [id]="'category-' + childCategory.id"
        [label]="childCategory.label"
        [checked]="childCategory.checked"
        [disabled]="sidebarDisabled() || !!childCategory.disabled"
        (checkedChange)="onCategoryCheckedChange(childCategory.id, $event)"
      />
      }
    </div>
    } }
  </div>
</article>
