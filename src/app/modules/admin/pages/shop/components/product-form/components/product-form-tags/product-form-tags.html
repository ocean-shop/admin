<app-product-form-card [title]="texts().TAGS_TITLE" [icon]="icon" [disabled]="sidebarDisabled()">
  <app-product-form-shared-attributes
    chipVariant="tag"
    [searchInputId]="inputId"
    [searchLabel]="texts().TAGS_INPUT_PLACEHOLDER"
    [searchPlaceholder]="texts().TAGS_INPUT_PLACEHOLDER"
    [searchValue]="searchValue()"
    [interactionDisabled]="sidebarDisabled()"
    [isSearchLoading]="isSearchLoading()"
    [searchLoadingText]="texts().TAGS_SEARCH_LOADING"
    [searchEmptyText]="texts().TAGS_SEARCH_EMPTY"
    [assignedEmptyText]="texts().TAGS_ASSIGNED_EMPTY"
    [removeAriaLabel]="texts().TAGS_REMOVE_LABEL"
    [searchResults]="searchResults()"
    [assignedAttributes]="assignedTags()"
    (searchChange)="onSearchChange($event)"
    (assign)="onAssign($event)"
    (unassign)="onUnassign($event)"
  />
</app-product-form-card>
