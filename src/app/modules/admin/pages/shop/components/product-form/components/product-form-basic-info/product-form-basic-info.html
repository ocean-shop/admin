<app-product-form-card [title]="texts().BASIC_INFORMATION_TITLE">
  <div class="product-form-field-group">
    <app-input
      [id]="fieldIds().PRODUCT_NAME"
      [label]="texts().PRODUCT_NAME_LABEL"
      [placeholder]="texts().PRODUCT_NAME_PLACEHOLDER"
      [control]="productForm().name"
    />
  </div>

  <div class="product-form-field-group">
    <app-dropdown
      triggerMode="click"
      variant="form"
      [options]="statusOptions()"
      [formField]="productForm().status"
    />
  </div>

  <div class="product-form-field-group">
    <app-radio-group
      name="product-type"
      [label]="texts().PRODUCT_TYPE_LABEL"
      [options]="productTypeOptions()"
      [selectedValue]="productForm().type().value()"
      (valueChange)="onProductTypeOptionChange($event)"
    />
  </div>

  <div class="product-form-field-group">
    <app-textarea
      [id]="fieldIds().PRODUCT_DESCRIPTION"
      [label]="texts().DESCRIPTION_LABEL"
      [rows]="5"
      [placeholder]="texts().DESCRIPTION_PLACEHOLDER"
      [control]="productForm().description"
    />
  </div>

  <app-checkbox
    [id]="fieldIds().IS_POPULAR"
    [label]="texts().IS_POPULAR_LABEL"
    [control]="productForm().isPopular"
  />

  <app-checkbox
    [id]="fieldIds().IS_MAIN_BANNER"
    [label]="texts().IS_MAIN_BANNER_LABEL"
    [control]="productForm().isMainBanner"
  />
</app-product-form-card>
