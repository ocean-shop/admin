<app-product-form-card
  [title]="texts().ATTRIBUTES_TITLE"
  [icon]="icon"
  [disabled]="sidebarDisabled()"
>
  <app-product-form-shared-attributes
    [searchInputId]="inputId"
    [searchLabel]="texts().ATTRIBUTES_SEARCH_PLACEHOLDER"
    [searchPlaceholder]="texts().ATTRIBUTES_SEARCH_PLACEHOLDER"
    [searchValue]="searchValue()"
    [interactionDisabled]="sidebarDisabled()"
    [isSearchLoading]="isSearchLoading()"
    [searchLoadingText]="texts().ATTRIBUTES_SEARCH_LOADING"
    [searchEmptyText]="texts().ATTRIBUTES_SEARCH_EMPTY"
    [assignedEmptyText]="texts().ATTRIBUTES_ASSIGNED_EMPTY"
    [removeAriaLabel]="texts().ATTRIBUTES_REMOVE_LABEL"
    [searchResults]="searchResults()"
    [assignedAttributes]="assignedAttributes()"
    (searchChange)="onSearchChange($event)"
    (assign)="onAssign($event)"
    (unassign)="onUnassign($event)"
  />
</app-product-form-card>
