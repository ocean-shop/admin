<input
  #imageInput
  type="file"
  multiple
  class="product-form-image-input"
  [accept]="accept"
  [disabled]="interactionDisabled()"
  (change)="onFileInputChange($event)"
/>

<button
  type="button"
  class="product-form-dropzone"
  [class.product-form-dropzone-compact]="compactDropzone()"
  [disabled]="interactionDisabled()"
  (click)="imageInput.click()"
  (drop)="onDrop($event)"
  (dragover)="onDragOver($event)"
>
  <span class="material-symbols-outlined">{{ icons.UPLOAD }}</span>
  <p>{{ dropzoneHint() }}</p>
</button>

<div class="product-form-images-list">
  <p class="product-form-images-list-sub">{{ imageSubTitle() }}</p>
  @for (image of images(); track image.id; let first = $first; let last = $last) {
  <div class="product-form-image-row">
    <div class="product-form-image-row-content">
      <img class="product-form-image-preview" [src]="image.imageDataUrl" [alt]="image.name" />
      <div class="product-form-image-meta">
        <span class="material-symbols-outlined">{{ icons.IMAGE }}</span>
        <span class="product-form-image-name">{{ image.name }}</span>
      </div>
    </div>
    <div class="product-form-image-actions">
      <button
        type="button"
        [attr.aria-label]="texts.IMAGE_MOVE_UP_LABEL"
        [disabled]="interactionDisabled() || first"
        (click)="onMoveUp(image.id)"
      >
        <span class="image-action-icon material-symbols-outlined">{{ icons.MOVE_UP }}</span>
      </button>
      <button
        type="button"
        [attr.aria-label]="texts.IMAGE_MOVE_DOWN_LABEL"
        [disabled]="interactionDisabled() || last"
        (click)="onMoveDown(image.id)"
      >
        <span class="image-action-icon material-symbols-outlined">{{ icons.MOVE_DOWN }}</span>
      </button>
      <button
        type="button"
        class="product-form-image-delete"
        [attr.aria-label]="texts.IMAGE_REMOVE_LABEL"
        [disabled]="interactionDisabled()"
        (click)="onRemove(image.id)"
      >
        <span class="image-action-icon material-symbols-outlined">{{ icons.REMOVE }}</span>
      </button>
    </div>
  </div>
  } @empty {
  <p class="product-form-images-empty">{{ emptyStateText() }}</p>
  }
</div>
