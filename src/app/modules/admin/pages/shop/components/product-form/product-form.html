@if (sidebarDisabled()) {
<p class="product-form-sidebar-hint">{{ texts.SIDEBAR_DISABLED_HINT }}</p>
}

<div class="product-form-grid">
  <section class="product-form-main">
    <app-product-form-basic-info
      [productForm]="productForm()"
      [texts]="texts"
      [fieldIds]="fieldIds"
      [statusOptions]="statusOptions"
      [productTypeOptions]="productTypeOptions"
    />

    @if (isVariable()) {
    <app-product-form-variations
      [texts]="texts"
      [shopId]="shopId()"
      [productId]="productId()"
      [sidebarDisabled]="sidebarDisabled()"
      [initialVariations]="initialVariations()"
    />
    } @else {
    <app-product-form-pricing-inventory
      [productForm]="productForm()"
      [texts]="texts"
      [fieldIds]="fieldIds"
    />
    }

    <app-product-form-seo [productForm]="productForm()" [texts]="texts" [fieldIds]="fieldIds" />
  </section>

  <aside class="product-form-sidebar">
    <app-product-form-categories
      [texts]="texts"
      [shopId]="shopId()"
      [productId]="productId()"
      [sidebarDisabled]="sidebarDisabled()"
      [initialSelectedCategoryIds]="initialSelectedCategoryIds()"
    />

    <app-product-form-tags
      [texts]="texts"
      [shopId]="shopId()"
      [productId]="productId()"
      [sidebarDisabled]="sidebarDisabled()"
      [initialAssignedTags]="initialAssignedTags()"
    />

    <app-product-form-images
      [texts]="texts"
      [productId]="productId()"
      [sidebarDisabled]="sidebarDisabled()"
      [initialImages]="initialImages()"
    />

    <app-product-form-attributes
      [texts]="texts"
      [shopId]="shopId()"
      [productId]="productId()"
      [sidebarDisabled]="sidebarDisabled()"
      [initialAssignedAttributes]="initialAssignedAttributes()"
    />
  </aside>
</div>
