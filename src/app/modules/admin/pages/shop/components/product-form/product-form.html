@if (sidebarDisabled()) {
<p class="product-form-sidebar-hint">{{ texts().SIDEBAR_DISABLED_HINT }}</p>
}

<div class="product-form-grid">
  <section class="product-form-main">
    <app-product-form-basic-info
      [productForm]="productForm()"
      [texts]="texts()"
      [fieldIds]="fieldIds()"
      [productTypeOptions]="productTypeOptions()"
      [productTypeSimple]="productTypeSimple()"
      (productTypeChange)="onProductTypeOptionChange($event)"
    />

    <app-product-form-pricing-inventory
      [productForm]="productForm()"
      [texts]="texts()"
      [fieldIds]="fieldIds()"
      [statusOptions]="statusOptions()"
    />
  </section>

  <aside class="product-form-sidebar">
    <app-product-form-categories
      [texts]="texts()"
      [categories]="categories()"
      [sidebarDisabled]="sidebarDisabled()"
      (categoryToggle)="onCategoryCheckedChange($event.categoryId, $event.checked)"
    />

    <app-product-form-images
      [texts]="texts()"
      [sidebarDisabled]="sidebarDisabled()"
      [images]="images()"
      [isUploadLoading]="isImageUploadLoading()"
      (filesSelected)="onImageFilesSelected($event)"
      (moveUp)="onImageMoveUp($event)"
      (moveDown)="onImageMoveDown($event)"
      (remove)="onImageRemove($event)"
      (upload)="onImageUpload()"
    />

    <app-product-form-attributes
      [texts]="texts()"
      [sidebarDisabled]="sidebarDisabled()"
      [attributeSearchValue]="attributeSearchValue()"
      [isAttributeSearchLoading]="isAttributeSearchLoading()"
      [attributeSearchResults]="attributeSearchResults()"
      [assignedAttributes]="assignedAttributes()"
      (attributeSearchChange)="onAttributeSearchChange($event)"
      (attributeAssign)="onAttributeAssign($event)"
      (attributeUnassign)="onAttributeUnassign($event)"
    />

    <app-product-form-tags
      [texts]="texts()"
      [sidebarDisabled]="sidebarDisabled()"
      [tagSearchValue]="tagSearchValue()"
      [isTagSearchLoading]="isTagSearchLoading()"
      [tagSearchResults]="tagSearchResults()"
      [assignedTags]="assignedTags()"
      (tagSearchChange)="onTagSearchChange($event)"
      (tagAssign)="onTagAssign($event)"
      (tagUnassign)="onTagUnassign($event)"
    />
  </aside>
</div>
