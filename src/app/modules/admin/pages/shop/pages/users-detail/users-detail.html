<app-page-layout>
  <app-breadcrumbs [items]="breadcrumbItems()" />
  <app-page-header [title]="textData.DETAILS_TITLE" [description]="textData.DETAILS_DESCRIPTION" />

  @if (hasError()) {
  <app-state-message [message]="textData.USER_DETAIL_LOAD_ERROR" />
  } @if (!isLoading() && user()) {
  <section class="users-detail-content">
    <app-section-card [title]="textData.USER_INFO_TITLE">
      <app-info-list [rows]="userInfoRows()" />
    </app-section-card>

    <app-section-card [title]="textData.USER_OTPS_TITLE">
      <div class="users-detail-scroll-area">
        <app-table
          [columns]="otpColumns"
          [rows]="otpRows()"
          [emptyText]="textData.USER_OTPS_EMPTY_STATE"
        />
      </div>
    </app-section-card>

    <app-section-card [title]="textData.USER_SESSIONS_TITLE">
      <div class="users-detail-scroll-area">
        <app-table
          [columns]="sessionColumns"
          [rows]="sessionRows()"
          [emptyText]="textData.USER_SESSIONS_EMPTY_STATE"
        />
      </div>
    </app-section-card>

    <app-section-card [title]="textData.USER_ROLE_TITLE">
      @if (roleRows().length) {
      <app-info-list [rows]="roleRows()" />
      } @else {
      <app-state-message [message]="textData.USER_ROLE_EMPTY_STATE" />
      }
    </app-section-card>
  </section>
  } @else if (isLoading()) {
  <app-state-message [message]="textData.TABLE_LOADING_TEXT" />
  }
</app-page-layout>
