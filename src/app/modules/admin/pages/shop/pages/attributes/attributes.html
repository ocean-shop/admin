<app-page-layout>
  <app-breadcrumbs [items]="breadcrumbItems()" />

  <app-page-header [title]="textData.PAGE_TITLE" [description]="textData.PAGE_DESCRIPTION">
    <app-button
      [label]="textData.CREATE_LABEL"
      [icon]="createAttributeIcon"
      [iconLeading]="true"
      [disabled]="!isShopContextReady() || isActionLoading()"
      variant="create"
      type="button"
      (click)="onCreateAttribute()"
    />
  </app-page-header>

  @if (!isShopContextReady()) {
  <app-state-message tone="warning" [message]="textData.SHOP_ID_REQUIRED_MESSAGE" />
  }

  <app-filter-bar (applied)="onSearchSubmit()">
    <app-filter-input
      filterFields
      [inputId]="searchInputId"
      [label]="textData.SEARCH_LABEL"
      [placeholder]="textData.SEARCH_PLACEHOLDER"
      [value]="searchInput()"
      [disabled]="isSearchDisabled()"
      (valueChange)="searchInput.set($event)"
    />
    <app-filter-actions
      filterControls
      [applyLabel]="textData.SEARCH_BUTTON_LABEL"
      [resetLabel]="textData.SEARCH_RESET_LABEL"
      [applyDisabled]="isSearchDisabled()"
      [resetDisabled]="isSearchDisabled()"
      (cleared)="onSearchReset()"
    />
  </app-filter-bar>

  @if (hasError()) {
  <app-state-message [message]="textData.LOAD_ERROR_MESSAGE" />
  }

  <app-table
    [columns]="tableColumns"
    [rows]="attributeRows()"
    [loading]="isLoading()"
    [loadingText]="textData.TABLE_LOADING_TEXT"
    [emptyText]="textData.EMPTY_STATE"
    [deleteEnabled]="true"
    [deleteLabel]="textData.TABLE_DELETE_LABEL"
    (deleteRow)="onDeleteAttribute($event)"
  />

  @if (totalItems() > pageSize) {
  <app-pagination
    class="attributes-pagination"
    [currentPage]="currentPage()"
    [pageSize]="pageSize"
    [totalItems]="totalItems()"
    [totalPages]="totalPages()"
    [label]="textData.PAGINATION_LABEL"
    (pageChange)="onPageChange($event)"
  />
  }

  <app-attribute-form-modal
    [isOpen]="isCreateModalOpen()"
    [confirmLoading]="isActionLoading()"
    (closed)="onCloseModal()"
    (confirmed)="onConfirmCreate($event)"
  />

  <app-confirm-modal
    [isOpen]="isDeleteModalOpen()"
    [title]="textData.MODAL_DELETE_TITLE"
    [confirmLabel]="textData.MODAL_DELETE_CONFIRM_LABEL"
    [message]="textData.MODAL_DELETE_MESSAGE"
    [highlight]="selectedAttribute()?.name ?? ''"
    [suffix]="textData.MODAL_DELETE_MESSAGE_SUFFIX"
    [loading]="isActionLoading()"
    (closed)="onCloseModal()"
    (confirmed)="onConfirmDelete()"
  />
</app-page-layout>
