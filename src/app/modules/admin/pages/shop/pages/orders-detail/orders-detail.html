<app-page-layout>
  <app-breadcrumbs [items]="breadcrumbItems()" />
  <app-page-header [title]="textData.DETAILS_TITLE" [description]="textData.DETAILS_DESCRIPTION" />

  @if (hasError()) {
  <app-state-message [message]="textData.ORDER_DETAILS_LOAD_ERROR" />
  } @if (!isLoading() && order()) {
  <section class="order-details-layout">
    <div class="order-details-main-content">
      <app-section-card [title]="textData.GENERAL_INFO_TITLE">
        <app-info-list [rows]="orderInfoRows()" />
      </app-section-card>

      <app-section-card [title]="textData.PRODUCTS_TITLE">
        <app-table
          [columns]="itemColumns"
          [rows]="orderItemRows()"
          [emptyText]="textData.ORDER_ITEMS_EMPTY_STATE"
        />
      </app-section-card>

      <app-section-card [title]="textData.USER_TITLE">
        <app-info-list [rows]="userInfoRows()" />
      </app-section-card>

      @if (extraDataRows().length) {
      <app-section-card [title]="textData.EXTRA_DATA_TITLE">
        <app-info-list [rows]="extraDataRows()" [monospace]="true" />
      </app-section-card>
      }
    </div>

    <aside class="order-details-side-content">
      <app-section-card [title]="textData.PAYMENT_STATUS_LABEL">
        <div class="order-details-status-actions">
          <app-dropdown
            triggerMode="click"
            variant="bordered"
            [icon]="paymentStatusIcon"
            [options]="paymentStatusOptions"
            [value]="selectedPaymentStatus()"
            (optionSelected)="onPaymentStatusSelected($event)"
          />
          <app-button
            [label]="textData.SAVE_PAYMENT_STATUS_LABEL"
            [fullWidth]="false"
            [disabled]="!canSavePaymentStatus() || isPaymentUpdating()"
            (click)="onSavePaymentStatus()"
          />
        </div>
      </app-section-card>

      <app-section-card [title]="textData.ORDER_STATUS_LABEL">
        <div class="order-details-status-actions">
          <app-dropdown
            triggerMode="click"
            variant="bordered"
            [icon]="statusIcon"
            [options]="statusOptions"
            [value]="selectedOrderStatus()"
            (optionSelected)="onStatusSelected($event)"
          />
          <app-button
            [label]="textData.SAVE_STATUS_LABEL"
            [fullWidth]="false"
            [disabled]="!canSaveStatus() || isStatusUpdating()"
            (click)="onSaveStatus()"
          />
        </div>
      </app-section-card>
    </aside>
  </section>
  } @else if (isLoading()) {
  <app-state-message [message]="textData.TABLE_LOADING_TEXT" />
  }
</app-page-layout>
