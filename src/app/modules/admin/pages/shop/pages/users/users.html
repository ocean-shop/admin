<app-page-layout>
  <app-breadcrumbs [items]="breadcrumbItems()" />

  <app-page-header [title]="textData.PAGE_TITLE" [description]="textData.PAGE_DESCRIPTION" />

  @if (!isShopContextReady()) {
  <app-state-message tone="warning" [message]="textData.SHOP_ID_REQUIRED_MESSAGE" />
  }

  <app-filter-bar (applied)="onApplyFilters()">
    <app-filter-input
      filterFields
      [inputId]="emailFilterId"
      [label]="textData.EMAIL_FILTER_LABEL"
      [placeholder]="textData.EMAIL_FILTER_PLACEHOLDER"
      [value]="emailInput()"
      [disabled]="isFilterDisabled()"
      (valueChange)="emailInput.set($event)"
    />
    <app-filter-input
      filterFields
      [inputId]="phoneFilterId"
      [label]="textData.PHONE_FILTER_LABEL"
      [placeholder]="textData.PHONE_FILTER_PLACEHOLDER"
      [value]="phoneNumberInput()"
      [disabled]="isFilterDisabled()"
      (valueChange)="phoneNumberInput.set($event)"
    />
    <app-filter-dropdown
      filterControls
      [label]="textData.SORT_LABEL"
      [icon]="sortIcon"
      [options]="sortOptions"
      [value]="selectedSort()"
      (optionSelected)="onSortSelected($event)"
    />
    <app-filter-actions
      filterControls
      [applyLabel]="textData.FILTER_APPLY_LABEL"
      [resetLabel]="textData.FILTER_RESET_LABEL"
      [applyDisabled]="isFilterDisabled()"
      [resetDisabled]="isFilterDisabled()"
      (cleared)="onResetFilters()"
    />
  </app-filter-bar>

  @if (hasError()) {
  <app-state-message [message]="textData.LOAD_ERROR_MESSAGE" />
  }

  <app-table
    [columns]="tableColumns"
    [rows]="userRows()"
    [loading]="isLoading()"
    [loadingText]="textData.TABLE_LOADING_TEXT"
    [emptyText]="textData.EMPTY_STATE"
    [updateEnabled]="true"
    [updateIcon]="showIcon"
    [updateLabel]="textData.TABLE_SHOW_LABEL"
    [actionsLabel]="textData.TABLE_ACTIONS_LABEL"
    (updateRow)="onShowUser($event)"
  />

  @if (totalItems() > pageSize) {
  <app-pagination
    class="users-pagination"
    [currentPage]="currentPage()"
    [pageSize]="pageSize"
    [totalItems]="totalItems()"
    [totalPages]="totalPages()"
    [label]="textData.PAGINATION_LABEL"
    (pageChange)="onPageChange($event)"
  />
  }
</app-page-layout>
