<main class="products-update-page">
  <form class="products-update-container" (submit)="$event.preventDefault(); onSubmit()">
    <header class="products-update-header">
      <div>
        <app-breadcrumbs [items]="breadcrumbItems()" />
        <h1 class="products-update-title">{{ textData.PAGE_TITLE }}</h1>
        <p class="products-update-description">{{ textData.PAGE_DESCRIPTION }}</p>
      </div>
      <app-button
        [label]="textData.UPDATE_LABEL"
        type="submit"
        variant="create"
        [fullWidth]="false"
        [disabled]="!isFormValid() || isSubmitting() || isLoadingProduct()"
      />
    </header>

    <app-product-form
      [productForm]="productForm"
      [texts]="textData"
      [toastTexts]="textData"
      [fieldIds]="fieldIds"
      [statusOptions]="statusOptions"
      [productTypeOptions]="productTypeOptions"
      [productTypeSimple]="productTypeSimple"
      [shopId]="shopId()"
      [productId]="productId()"
      [sidebarDisabled]="false"
      [initialSelectedCategoryIds]="selectedCategoryIds()"
      [initialAssignedAttributes]="assignedAttributes()"
      [initialAssignedTags]="assignedTags()"
      [initialImages]="images()"
      [initialVariations]="variations()"
      (productTypeChange)="onProductTypeChange($event)"
    />
  </form>
</main>
