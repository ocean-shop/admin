<app-page-layout>
  <form class="products-update-form" (submit)="onSubmit($event)">
    <app-breadcrumbs [items]="breadcrumbItems()" />

    <app-page-header [title]="textData.PAGE_TITLE" [description]="textData.PAGE_DESCRIPTION">
      <app-button
        [label]="textData.UPDATE_LABEL"
        type="submit"
        variant="create"
        [disabled]="isSubmitDisabled()"
      />
    </app-page-header>

    @if (!isRouteContextReady()) {
    <app-state-message tone="warning" [message]="textData.SHOP_CONTEXT_REQUIRED_MESSAGE" />
    } @else if (productQuery.isError()) {
    <app-state-message tone="warning" [message]="textData.PRODUCT_NOT_FOUND_MESSAGE" />
    }

    <app-product-form
      [productForm]="productForm"
      [shopId]="shopId()"
      [productId]="productId()"
      [initialSelectedCategoryIds]="formSeeds().categoryIds"
      [initialAssignedAttributes]="formSeeds().attributes"
      [initialAssignedTags]="formSeeds().tags"
      [initialImages]="formSeeds().images"
      [initialVariations]="formSeeds().variations"
    />
  </form>
</app-page-layout>
