<app-page-layout>
  <app-breadcrumbs [items]="breadcrumbItems()" />

  <app-page-header [title]="textData.PAGE_TITLE" [description]="textData.PAGE_DESCRIPTION">
    <app-button
      [label]="textData.CREATE_LABEL"
      [icon]="createProductIcon"
      [iconLeading]="true"
      [disabled]="!isShopContextReady()"
      variant="create"
      type="button"
      (click)="onCreateProduct()"
    />
  </app-page-header>

  @if (!isShopContextReady()) {
  <app-state-message tone="warning" [message]="textData.SHOP_ID_REQUIRED_MESSAGE" />
  }

  <app-filter-bar (applied)="onApplyFilters()">
    <app-filter-input
      filterFields
      [inputId]="nameFilterId"
      [label]="textData.NAME_FILTER_LABEL"
      [placeholder]="textData.NAME_FILTER_PLACEHOLDER"
      [value]="nameInput()"
      [disabled]="isFilterDisabled()"
      (valueChange)="nameInput.set($event)"
    />
    <app-filter-input
      filterFields
      [inputId]="skuFilterId"
      [label]="textData.SKU_FILTER_LABEL"
      [placeholder]="textData.SKU_FILTER_PLACEHOLDER"
      [value]="skuInput()"
      [disabled]="isFilterDisabled()"
      (valueChange)="skuInput.set($event)"
    />
    <div filterFields class="products-category-filter">
      <span class="products-category-filter-label">{{ textData.CATEGORY_FILTER_LABEL }}</span>
      <app-multi-select-dropdown
        triggerMode="click"
        variant="bordered"
        optionVariant="tree"
        [icon]="categoryFilterIcon"
        [label]="textData.CATEGORY_FILTER_LABEL"
        [options]="categoryOptions()"
        [value]="categoryIdsInput()"
        (optionToggled)="onCategoryOptionToggled($event)"
      />
    </div>
    <app-filter-dropdown
      filterControls
      [label]="textData.SORT_LABEL"
      [icon]="sortIcon"
      [options]="sortOptions"
      [value]="selectedSort()"
      (optionSelected)="onSortSelected($event)"
    />
    <app-filter-actions
      filterControls
      [applyLabel]="textData.FILTER_APPLY_LABEL"
      [resetLabel]="textData.FILTER_RESET_LABEL"
      [applyDisabled]="isApplyDisabled()"
      [resetDisabled]="isFilterDisabled()"
      (cleared)="onResetFilters()"
    />
  </app-filter-bar>

  @if (hasError()) {
  <app-state-message [message]="textData.LOAD_ERROR_MESSAGE" />
  }

  <app-table
    [columns]="tableColumns"
    [rows]="productRows()"
    [loading]="isLoading()"
    [loadingText]="textData.TABLE_LOADING_TEXT"
    [emptyText]="textData.EMPTY_STATE"
    [updateEnabled]="true"
    [updateLabel]="textData.TABLE_UPDATE_LABEL"
    [deleteEnabled]="true"
    [deleteLabel]="textData.TABLE_DELETE_LABEL"
    [actionsLabel]="textData.TABLE_ACTIONS_LABEL"
    (updateRow)="onUpdateProduct($event)"
    (deleteRow)="onDeleteProduct($event)"
  />

  <app-confirm-modal
    [isOpen]="isDeleteModalOpen()"
    [title]="textData.MODAL_DELETE_TITLE"
    [confirmLabel]="textData.MODAL_DELETE_CONFIRM_LABEL"
    [message]="textData.MODAL_DELETE_MESSAGE"
    [highlight]="selectedProduct()?.title ?? ''"
    [suffix]="textData.MODAL_DELETE_MESSAGE_SUFFIX"
    [loading]="isActionLoading()"
    (closed)="onCloseDeleteModal()"
    (confirmed)="onConfirmDelete()"
  />

  @if (totalItems() > pageSize) {
  <app-pagination
    class="products-pagination"
    [currentPage]="currentPage()"
    [pageSize]="pageSize"
    [totalItems]="totalItems()"
    [totalPages]="totalPages()"
    [label]="textData.PAGINATION_LABEL"
    (pageChange)="onPageChange($event)"
  />
  }
</app-page-layout>
