<app-page-layout>
  <form class="products-create-form" (submit)="onSubmit($event)">
    <app-breadcrumbs [items]="breadcrumbItems()" />

    <app-page-header [title]="textData.PAGE_TITLE">
      <app-button
        [label]="textData.CREATE_LABEL"
        type="submit"
        variant="create"
        [disabled]="isSubmitDisabled()"
      />
    </app-page-header>

    @if (!shopId()) {
    <app-state-message tone="warning" [message]="textData.SHOP_ID_REQUIRED_MESSAGE" />
    }

    <app-product-form
      [productForm]="productForm"
      [shopId]="shopId()"
      [productId]="createdProductId()"
      [sidebarDisabled]="isSidebarDisabled()"
    />
  </form>
</app-page-layout>
