<main class="products-create-page">
  <form class="products-create-container" (submit)="$event.preventDefault(); onSubmit()">
    <header class="products-create-header">
      <div>
        <h1 class="products-create-title">{{ textData.PAGE_TITLE }}</h1>
      </div>
      <app-button
        [label]="textData.CREATE_LABEL"
        type="submit"
        variant="create"
        [fullWidth]="false"
        [disabled]="!isFormValid() || isSubmitting()"
      />
    </header>

    <app-product-form
      [productForm]="productForm"
      [texts]="textData"
      [toastTexts]="textData"
      [fieldIds]="fieldIds"
      [statusOptions]="statusOptions"
      [productTypeOptions]="productTypeOptions"
      [productTypeSimple]="productTypeSimple"
      [shopId]="shopId()"
      [productId]="createdProductId()"
      [sidebarDisabled]="isSidebarDisabled()"
      (productTypeChange)="onProductTypeChange($event)"
    />
  </form>
</main>
