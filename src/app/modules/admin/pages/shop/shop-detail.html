<section class="shop-detail-container">
  <header class="shop-detail-header">
    <app-breadcrumbs [items]="breadcrumbItems()" />
    <h3 class="shop-detail-title">{{ textData.PAGE_TITLE }}</h3>
    <p class="shop-detail-placeholder">{{ textData.PAGE_DESCRIPTION }}</p>
  </header>

  @if (shopId()) {
  <app-shop-statistics [shopId]="shopId()" />
  }

  <div class="shop-detail-cards">
    @for (section of sections(); track section.segment) {
    <article class="shop-detail-card">
      <div class="shop-detail-card-icon-wrapper">
        <span class="material-symbols-outlined shop-detail-card-icon">{{ section.icon }}</span>
      </div>
      <div class="shop-detail-card-content">
        <h4 class="shop-detail-card-title">{{ section.title }}</h4>
        <p class="shop-detail-card-description">{{ section.description }}</p>
      </div>
      <a class="shop-detail-card-link" [routerLink]="section.route">
        <span class="shop-detail-card-link-label">{{ section.linkLabel }}</span>
        <span class="material-symbols-outlined shop-detail-card-link-icon">{{ linkIcon }}</span>
      </a>
    </article>
    }
  </div>
</section>
