<app-page-layout>
  <app-breadcrumbs [items]="breadcrumbItems()" />
  <app-page-header [title]="textData.PAGE_TITLE" [description]="textData.PAGE_DESCRIPTION" />

  @if (shopId()) {
  <app-shop-statistics [shopId]="shopId()" />
  }

  <div class="shop-detail-cards">
    @for (section of sections(); track section.segment) {
    <app-nav-tile [tile]="section" />
    }
  </div>
</app-page-layout>
