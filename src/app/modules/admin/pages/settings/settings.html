<app-page-layout>
  <app-page-header [title]="pageTitle" />

  <div class="settings-content">
    <section class="settings-card">
      <app-settings-form />
    </section>

    <section class="settings-card settings-cache">
      <div class="settings-cache-info">
        <h2 class="settings-cache-title">{{ cacheTitle }}</h2>
        <p class="settings-cache-description">{{ cacheDescription }}</p>
      </div>
      <app-button
        [label]="cacheInvalidateLabel"
        [icon]="cacheInvalidateIcon"
        [iconLeading]="true"
        [fullWidth]="false"
        [loading]="isCacheInvalidating()"
        variant="outline"
        type="button"
        (click)="onInvalidateCache()"
      />
    </section>
  </div>
</app-page-layout>
