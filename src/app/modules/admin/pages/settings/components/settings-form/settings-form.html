<form class="form-container" (submit)="$event.preventDefault(); onSubmit()">
  <div class="field-group">
    <span class="field-label">{{ languageLabel }}</span>
    <app-dropdown
      triggerMode="click"
      variant="form"
      [icon]="languageIcon"
      [options]="languageOptions"
      [formField]="settingsForm.language"
    />
  </div>
  <app-button
    [label]="saveLabel"
    [icon]="saveIcon"
    type="submit"
    [disabled]="!isFormValid() || isLoading()"
  />
</form>
