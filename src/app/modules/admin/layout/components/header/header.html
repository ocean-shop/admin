<header class="admin-header">
  <div class="header-left">
    <button
      class="icon-button"
      id="menu-toggle"
      type="button"
      [attr.aria-label]="textData.MENU_TOGGLE_LABEL"
      [attr.aria-expanded]="layoutService.isSidebarOpen()"
      (click)="toggleMenu()"
    >
      <span class="header-icon" aria-hidden="true">{{ icons.MENU }}</span>
    </button>
    <a [routerLink]="adminRoute" class="header-title-link">{{ textData.TITLE }}</a>
  </div>
  <div class="header-right">
    <app-notifications />
    <div class="account-menu-container">
      <button
        class="account-button"
        id="account-toggle"
        type="button"
        aria-haspopup="menu"
        [attr.aria-expanded]="isAccountMenuOpen()"
        [attr.aria-label]="textData.ACCOUNT_LABEL"
        (click)="toggleAccountMenu($event)"
      >
        <span class="account-avatar" aria-hidden="true">
          <span class="header-icon">{{ icons.ACCOUNT }}</span>
        </span>
        <span class="header-icon account-chevron" aria-hidden="true">{{ icons.EXPAND }}</span>
      </button>
      @if (isAccountMenuOpen()) {
      <app-simple-menu [items]="accountMenuItems" (itemSelected)="onMenuItemSelected($event)" />
      }
    </div>
  </div>
</header>
