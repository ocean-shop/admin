<form class="form-container" (submit)="$event.preventDefault(); onSubmit()">
  <app-input
    id="otp"
    [placeholder]="texts.OTP_PLACEHOLDER"
    [label]="texts.OTP_LABEL"
    icon="lock"
    [control]="otpForm.otp"
  ></app-input>
  @if (timeLeft() > 0) {
  <div class="resend-container">
    <p class="resend-text">
      {{ texts.TIMER_PREFIX }} <span class="resend-timer">{{ formattedTime() }}</span>
    </p>
  </div>
  <app-button
    [label]="texts.SUBMIT_BUTTON_LABEL"
    icon="arrow_forward"
    type="submit"
    [disabled]="!isFormValid() || isLoading()"
  ></app-button>
  } @else {
  <div class="flex justify-center text-label-md text-on-surface-variant">
    <app-button-line
      id="otp-resend"
      [label]="texts.RESEND_BUTTON_LABEL"
      type="button"
      [disabled]="isLoading()"
      (click)="onResend()"
    ></app-button-line>
  </div>
  <app-button
    [label]="texts.BACK_BUTTON_LABEL"
    icon="arrow_back"
    type="button"
    (click)="onBackToLogin()"
  ></app-button>
  }
</form>
