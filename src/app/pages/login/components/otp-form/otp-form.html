<form class="form-container" (submit)="$event.preventDefault(); onSubmit()">
  <app-input
    id="otp"
    [placeholder]="texts.otpPlaceholder"
    [label]="texts.otpLabel"
    icon="lock"
    [control]="otpForm.otp"
  ></app-input>
  @if (timeLeft() > 0) {
  <div class="resend-container">
    <p class="resend-text">
      {{ texts.timerPrefix }} <span class="resend-timer">{{ formattedTime() }}</span>
    </p>
  </div>
  <app-button
    [label]="texts.submitButtonLabel"
    icon="arrow_forward"
    type="submit"
    [disabled]="!isFormValid() || isLoading()"
  ></app-button>
  } @else {
  <div class="flex justify-center text-label-md text-on-surface-variant">
    <app-button-line
      [label]="texts.resendButtonLabel"
      type="button"
      (click)="resendCode()"
    ></app-button-line>
  </div>
  <app-button
    [label]="texts.backButtonLabel"
    icon="arrow_back"
    type="button"
    (click)="onBackToLogin()"
  ></app-button>
  }
</form>
