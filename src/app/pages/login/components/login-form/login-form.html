<form class="form-container" (submit)="$event.preventDefault(); onSubmit()">
  <app-input
    id="identity"
    [placeholder]="texts.identityPlaceholder"
    [label]="texts.identityLabel"
    icon="person"
    [control]="loginForm.identity"
  ></app-input>
  <app-button
    [label]="texts.submitButtonLabel"
    icon="arrow_forward"
    type="submit"
    [disabled]="!isFormValid() || isLoading()"
  ></app-button>
</form>
