<form class="form-container" (submit)="$event.preventDefault(); onSubmit()">
  <app-input
    id="identity"
    placeholder="Email або телефон"
    label="Email або телефон"
    icon="person"
    [control]="loginForm.identity"
  ></app-input>
  <app-button
    label="Увійти"
    icon="arrow_forward"
    type="submit"
    [disabled]="!isFormValid() || isLoading()"
  ></app-button>
</form>
