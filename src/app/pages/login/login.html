<main class="main-container">
  <section class="login-card">
    <span class="login-mark" aria-hidden="true">
      <span class="material-symbols-outlined">{{ markIcon }}</span>
    </span>
    <p class="title">{{ pageTexts.TITLE }}</p>
    <div class="welcome-section">
      <h1 class="subtitle">{{ pageTexts.WELCOME_TITLE }}</h1>
      <p class="description">{{ pageTexts.WELCOME_DESCRIPTION }}</p>
    </div>
    @if (currentView() === LoginView.Login) {
    <app-login-form [isLoading]="isBusy()" (submitEvent)="onSubmit($event)"></app-login-form>
    } @else {
    <app-otp-form
      [isLoading]="isBusy()"
      [expiresAt]="otpExpiresAt()"
      (submitEvent)="onOtpSubmit($event)"
      (resendEvent)="onResend()"
      (backToLoginEvent)="onBackToLogin()"
    ></app-otp-form>
    }
  </section>
</main>
