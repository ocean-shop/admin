<main class="main-container">
  <header class="header">
    <h1 class="title">{{ pageTexts.TITLE }}</h1>
  </header>
  <section
    class="login-card"
    [class.m3-elevation-3]="isFocused()"
    [class.m3-elevation-2]="!isFocused()"
  >
    <div class="welcome-section">
      <h2 class="subtitle">{{ pageTexts.WELCOME_TITLE }}</h2>
      <p class="description">{{ pageTexts.WELCOME_DESCRIPTION }}</p>
    </div>
    @if (currentView() === LoginView.Login) {
    <app-login-form [isLoading]="isBusy()" (submitEvent)="onSubmit($event)"></app-login-form>
    } @else {
    <app-otp-form
      [isLoading]="isBusy()"
      [expiresAt]="otpExpiresAt()"
      (submitEvent)="onOtpSubmit($event)"
      (resendEvent)="onResend()"
      (backToLoginEvent)="onBackToLogin()"
    ></app-otp-form>
    }
  </section>
  <div class="decorative-bar"></div>
</main>
