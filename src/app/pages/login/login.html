<main class="main-container">
  <header class="header">
    <h1 class="title">{{ pageTexts.title }}</h1>
  </header>
  <section
    class="login-card"
    [class.m3-elevation-3]="isFocused()"
    [class.m3-elevation-2]="!isFocused()"
  >
    <div class="welcome-section">
      <h2 class="subtitle">{{ pageTexts.welcomeTitle }}</h2>
      <p class="description">{{ pageTexts.welcomeDescription }}</p>
    </div>
    @if (currentView() === LoginView.Login) {
    <app-login-form [isLoading]="isLoading()" (submitEvent)="onSubmit($event)"></app-login-form>
    } @else {
    <app-otp-form
      [isLoading]="isLoading()"
      (submitEvent)="onOtpSubmit($event)"
      (backToLoginEvent)="onBackToLogin()"
    ></app-otp-form>
    }
  </section>
  <div class="decorative-bar"></div>
</main>
